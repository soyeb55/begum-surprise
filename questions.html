<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get to know you more 🤍</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,"Times New Roman",serif;color:#18362f;
  background:radial-gradient(ellipse at 50% 35%,#145849 0%,#0b4438 45%,#052b25 100%)}
.card{width:min(560px,92vw);min-height:440px;padding:2rem 1.5rem 3.5rem;border-radius:22px;text-align:center;
  background:#fffaf0;border:1px solid #d8c28c;box-shadow:0 25px 60px #00000040;position:relative;overflow:hidden}
.tag{font:600 .75rem Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#9a7734}
.emoji{font-size:3.5rem;margin:.5rem 0}
h2{font-weight:normal;color:#073c32;font-size:1.5rem;line-height:1.4;margin:.6rem 0}
input[type=text]{font:inherit;font-size:1rem;padding:.5rem;border:1px solid #d8b66a;border-radius:12px;color:#073c32;outline:none}
input[type=text]:focus{border-color:#0b5142}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;margin-top:1rem}
.choice{padding:.6rem 1rem;border-radius:999px;border:1px solid #d8b66a;background:#fff;color:#163c32;
  font:inherit;cursor:pointer;transition:transform .2s,background .2s}
.choice:hover{transform:scale(1.05)}
.choice.picked{background:#0b5142;color:#fff9e9;border-color:#0b5142}
.btn{margin-top:1.4rem;padding:.9rem 1.7rem;border:none;border-radius:999px;background:#d8b66a;color:#163c32;
  font:inherit;font-size:1.05rem;cursor:pointer;transition:transform .2s;margin-left:.3rem;margin-right:.3rem}
.btn:hover{transform:scale(1.06)}
.compliment{display:none;margin-top:1rem;padding:.8rem 1rem;border-radius:16px;background:#edf3e8;
  border:1px solid #d4dfcc;font-style:italic;line-height:1.7;animation:pop .5s ease both}
.compliment.show{display:block}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.bar{position:absolute;bottom:0;left:0;height:6px;background:#d8b66a;transition:width .4s}
.step.active{display:block;animation:pop .5s ease both}
.summary{text-align:left;line-height:1.9;font-size:1rem;margin-top:1rem}
.summary div{padding:.4rem 0;border-bottom:1px dashed #e8dcc0}
/* Phone fix: allow scrolling on small screens */
html, body { height: auto !important; min-height: 100% !important; overflow-y: auto !important; }
body { align-items: flex-start !important; padding: 1.5rem 0.8rem 4rem !important; }
</style>
</head>
<body>
<div class="card" id="card">
  <div id="steps"></div>
  <div class="bar" id="bar" style="width:0%"></div>
</div>

<script>
// ===== Questions =====
const questions = [
  { emoji: "🥰", q: "Sach batao Begum Ji, aap mujhe sabse zyada kab miss karti ho?",
    type: "open", compliment: "Main bhi aapko bahut miss karta hoon, aap jitna sochti ho usse bhi zyada 🤍" },

  { emoji: "😊", q: "Mere kis baat se aapka dil dhadakne lagta hai?",
    type: "open", compliment: "Aapki ye baat sunkar mera dil bhi khush ho gaya 🤍" },

  { emoji: "🌸", q: "Hum phone par baat karte hain, to aapko sabse achha kya lagta hai?",
    type: "open", compliment: "Aapki awaaz meri sabse pyaari awaaz hai 🌸" },

  { emoji: "🙈", q: "Inmein se kaun si baat sunkar aap sabse zyada sharma jaati ho?",
    type: "choice", options: ["Jab main aapka naam pyaar se leta hoon", "Jab main aapko message karta hoon", "Jab main kehta hoon aap bahut pyaari lagti ho", "Jab main bas aapko dekhta rehta hoon"],
    compliment: "Main ye sab karta rahunga, kyunki aapko sharmate hue dekhna mujhe bahut achha lagta hai 🙈" },

  { emoji: "💛", q: "Mere aapke saath behavior mein aapko sabse achhi kaun si baat lagti hai?",
    type: "open", compliment: "Shukriya aapka, aap isse bhi zyada deserve karti ho 💛" },

  { emoji: "🌙", q: "Mere andar kaun si quality aapko sabse zyada pasand hai?",
    type: "open", compliment: "Shukriya, main aapke liye ye quality hamesha banaye rakhne ki koshish karunga 🤍" },

  { emoji: "☕", q: "Agar hum ek cozy shaam saath mein bitayein, to aap kya karna chahogi?",
    type: "choice", options: ["Movie dekhna", "Saath mein kuch banana", "Drive par jaana", "Raat bhar baatein karna"],
    compliment: "Ye to aapke saath perfect shaam hogi 🌙" },

  { emoji: "📝", q: "Fill in the blanks: Mera pasandida khana ____ hai aur mera pasandida rang ____ hai.",
    type: "blank", blanks: 2, compliment: "Batane ke liye shukriya, main ise hamesha yaad rakhunga 📌" },

  { emoji: "💫", q: "Fill in the blanks: Jab main aapko dekhta hoon to mujhe ____ lagta hai, aur jab aap muskurati ho to mujhe ____ lagta hai.",
    type: "blank", blanks: 2, compliment: "Begum Ji, aapne mera din bana diya 🥹" },

  { emoji: "🌍", q: "Aap mere saath kis jagah ghoomna chahogi ek din?",
    type: "open", compliment: "Insha'Allah, main us safar ko zaroor pura karunga 🧳" },

  { emoji: "🧳", q: "Agar hum ek trip par jaayein, to aap pahaad, beach ya city mein se kya pasand karogi?",
    type: "choice", options: ["Pahaad", "Beach", "City"],
    compliment: "Theek hai! Hamari agli trip usi hisaab se plan karunga 🧳" },

  { emoji: "💕", q: "Agar hamara ek perfect din ho, to aap usme kya karna chahogi?",
    type: "open", compliment: "Ye sunkar achha laga, main ye din zaroor sach karunga 💕" },

  { emoji: "🏡", q: "Fill in the blanks: Mere sapnon ke ghar mein ____ hoga aur ____ ke liye ek jagah hogi.",
    type: "blank", blanks: 2, compliment: "Ye to pyaar se bhara ghar lagta hai 🏡" },

  { emoji: "🌹", q: "Aap chahogi ki main aapko roz kya kahun?",
    type: "open", compliment: "Main ye roz aapko kahunga, ye mera vaada hai 🌹" },

  { emoji: "🍳", q: "Aap chahogi ki main aapke liye khana banaun, ya hum saath mein banayein?",
    type: "choice", options: ["Aap mere liye banaiye", "Saath mein banayenge", "Dono"],
    compliment: "Main iska intezaar karunga, Begum Ji 😊" },

  { emoji: "🤍", q: "Hamari zindagi ke liye aapka ek sapna kya hai?",
    type: "open", compliment: "Main ye saare sapne aapke saath poore karna chahta hoon 🤍" },

  { emoji: "👨‍👩‍👧", q: "Aap ek din kitne bachche chahogi, Insha'Allah?",
    type: "choice", options: ["1", "2", "3", "4 ya usse zyada", "Allah par chhod diya"],
    compliment: "Allah jo bhi de, wo hamare liye barakat hogi 🤍" },

  { emoji: "🌷", q: "Aap hamare future ko kaisa dekhna chahti ho?",
    type: "open", compliment: "Main bhi yahi chahta hoon, aur har roz ise sach karne ki koshish karunga 🌷" }
];

// ===== Engine =====
const card = document.getElementById("steps");
const bar = document.getElementById("bar");
const answers = [];
let index = 0;

function render() {
  const item = questions[index];
  bar.style.width = (index / questions.length * 100) + "%";

  let inner = `<div class="step active">
    <div class="tag">Question ${index + 1} of ${questions.length}</div>
    <div class="emoji">${item.emoji}</div>
    <h2>${item.q}</h2>`;

  if (item.type === "open") {
    inner += `<input type="text" id="answer" placeholder="Yahan likhiye..." style="width:85%">`;
  }
  if (item.type === "blank") {
    inner += `<p style="font-size:.95rem;color:#6b7b70">Jo sach lage wo likhiye 🤍</p>`;
    inner += `<input type="text" id="answer" placeholder="Pehla blank" style="width:44%;margin:.3rem">`;
    inner += `<input type="text" id="answer2" placeholder="Doosra blank" style="width:44%;margin:.3rem">`;
  }
  if (item.type === "choice") {
    inner += `<div class="choices">` +
      item.options.map(o => `<button class="choice" onclick="pick(this)">${o}</button>`).join("") +
      `</div>`;
  }

  inner += `<div class="compliment" id="comp">${item.compliment}</div>`;
  inner += `<button class="btn" id="actionBtn" onclick="submitAnswer()">Answer 🤍</button>`;
  inner += `</div>`;
  card.innerHTML = inner;
}

function pick(btn) {
  document.querySelectorAll(".choice").forEach(b => b.classList.remove("picked"));
  btn.classList.add("picked");
}

function submitAnswer() {
  const item = questions[index];
  const btn = document.getElementById("actionBtn");

  // Save the answer (only the first time the button is pressed)
  if (btn.dataset.stage !== "compliment") {
    let value = "";
    if (item.type === "open") {
      value = document.getElementById("answer").value.trim();
    } else if (item.type === "blank") {
      value = document.getElementById("answer").value.trim() + " / " + document.getElementById("answer2").value.trim();
    } else if (item.type === "choice") {
      const picked = document.querySelector(".choice.picked");
      if (!picked) return;
      value = picked.textContent;
    }
    answers.push({ q: item.q, a: value || "(no answer)" });

    // Show the compliment first
    document.getElementById("comp").classList.add("show");
    btn.dataset.stage = "compliment";
    btn.textContent = index === questions.length - 1 ? "Summary dekhein 🤍" : "Agla sawal ➜";
    return;
  }

  // Move to the next question
  index++;
  if (index < questions.length) {
    render();
  } else {
    showSummary();
  }
}

function showSummary() {
  bar.style.width = "100%";
  card.innerHTML = `<div class="step active">
    <div class="emoji">🤍</div>
    <h2>Mere saath share karne ke liye shukriya</h2>
    <div class="summary">` +
    answers.map(x => `<div><strong>${x.q}</strong><br>${x.a}</div>`).join("") +
    `</div>
    <button class="btn" onclick="downloadAnswers()">Mujhe jawab bhejiye 💚</button>
    <button class="btn" onclick="restart()">Dobara shuru karein 🔁</button>
  </div>`;
}

function downloadAnswers() {
  const text = "Mere jawab aapke liye 🤍\n\n" +
    answers.map((x, i) => (i + 1) + ". " + x.q + "\nAnswer: " + x.a).join("\n\n");
  const url = "https://wa.me/918597262980?text=" + encodeURIComponent(text);
  window.open(url, "_blank");
}

function restart() {
  index = 0;
  answers.length = 0;
  render();
}

render();
</script>
</body>
</html>
