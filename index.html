<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Begum Ji 💚</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #052b25; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: none; }
  #nextBtn {
    position: fixed; right: 16px; bottom: 16px; z-index: 10;
    padding: 0.8rem 1.4rem; border: none; border-radius: 999px;
    background: #d8b66a; color: #163c32; font: 600 1rem Arial, sans-serif;
    cursor: pointer; box-shadow: 0 6px 16px #00000050;
  }
  #nextBtn:hover { transform: scale(1.05); }
  #nextBtn.hidden { display: none; }
</style>
</head>
<body>

<iframe id="frame" src="surprise.html" title="Our story"></iframe>
<button id="nextBtn" onclick="nextPage()">Next ➜</button>

<script>
  const pages = ["surprise.html", "story.html", "happy-surprise.html", "questions.html"];
  let current = 0;
  const frame = document.getElementById("frame");
  const nextBtn = document.getElementById("nextBtn");

  function nextPage() {
    if (current < pages.length - 1) {
      current++;
      frame.src = pages[current];
    }
    if (current === pages.length - 1) {
      nextBtn.classList.add("hidden"); // hide the button on the last page
    }
  }
</script>
</body>
</html>
